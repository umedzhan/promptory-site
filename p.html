<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptory — prompt</title>
<meta name="description" content="AI uchun tayyor prompt. Promptory ilovasida oching.">
<style>
  :root { color-scheme: light dark; --accent: #3B82F6; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0;
         min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .card { max-width: 480px; width: 100%; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px; display: grid; place-items: center;
          background: linear-gradient(135deg, #0EA5E9, #6366F1); }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { line-height: 1.6; opacity: .85; margin: .4rem 0; }
  .author { font-weight: 600; opacity: .7; }
  .btn { display: block; margin: 24px auto 8px; padding: 14px 24px; border-radius: 999px; font-weight: 600;
         text-decoration: none; background: var(--accent); color: #fff; max-width: 320px; }
  .ghost { background: transparent; color: var(--accent); border: 1px solid currentColor; margin-top: 0; }
  small { opacity: .6; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="46" height="46" viewBox="20 20 68 68" fill="none" aria-hidden="true">
      <path d="M35,40 L50,54 L35,68" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M57,70 H73" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      <path d="M72,28 Q73.8,35.2 81,37 Q73.8,38.8 72,46 Q70.2,38.8 63,37 Q70.2,35.2 72,28 Z" fill="#fff"/>
    </svg>
  </div>
  <h1 id="title">Promptory'dagi prompt</h1>
  <p id="desc">AI uchun tayyor prompt: bo'sh joylarni to'ldiring va nusxalang.</p>
  <p id="author" class="author"></p>
  <a id="open" class="btn" href="#">Promptory'da ochish</a>
  <a class="btn ghost" href="https://play.google.com/store/apps/details?id=uz.promptory.app">Ilovani yuklab olish</a>
  <p><small>Android uchun. Ilova o'rnatilmagan bo'lsa, Google Play ochiladi.</small></p>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id') || '';
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) id = '';
  var play = 'https://play.google.com/store/apps/details?id=uz.promptory.app';
  // Android Chrome: ilova bo'lsa ochiladi, bo'lmasa Play'ga o'tadi.
  var intent = 'intent://prompt/' + encodeURIComponent(id) +
      '#Intent;scheme=uz.promptory.app;package=uz.promptory.app;' +
      'S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
  document.getElementById('open').href = id ? intent : play;
  if (!id) return;

  // Faqat tasdiqlangan promptlar o'qiladi (RLS). Publishable key ilovaning o'zida ham ochiq.
  var url = 'https://ccuwwwpfcmndhtyawier.supabase.co/rest/v1/prompts' +
      '?select=title,description,profiles(username)&status=eq.approved&id=eq.' + encodeURIComponent(id);
  fetch(url, { headers: { apikey: 'sb_publishable_eVTIDFH2hjHAtFYoYB_UXw_Sou4J-7J' } })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var p = rows && rows[0];
      if (!p) return; // ichki prompt yoki o'chirilgan: umumiy matn qoladi
      document.getElementById('title').textContent = p.title;
      document.getElementById('desc').textContent = p.description || '';
      if (p.profiles && p.profiles.username) {
        document.getElementById('author').textContent = '@' + p.profiles.username;
      }
      document.title = p.title + ' — Promptory';
    })
    .catch(function () {});
})();
</script>
</body>
</html>
